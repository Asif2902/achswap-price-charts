specVersion: 0.0.4
schema:
  file: ./schema.graphql

dataSources:
  # ── Uniswap V2 factory (standard) ──────────────────────────────────────────
  - kind: ethereum
    name: FactoryV2
    network: arc-testnet
    source:
      address: "0x7cC023C7184810B84657D55c1943eBfF8603B72B"
      abi: FactoryV2
      startBlock: 12672857
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
        - Bundle
      abis:
        - name: FactoryV2
          file: ./abis/FactoryV2.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
      file: ./src/mappings/factory-v2.ts

  # ── Uniswap V3 factory (standard) ──────────────────────────────────────────
  - kind: ethereum
    name: FactoryV3
    network: arc-testnet
    source:
      address: "0x65fa500712D451b521bA114a4D3962565969F06a"
      abi: FactoryV3
      startBlock: 27739061
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
        - Bundle
      abis:
        - name: FactoryV3
          file: ./abis/FactoryV3.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
      file: ./src/mappings/factory-v3.ts

  # ── Uniswap V4 PoolManager (from achswap-contracts/v4) ─────────────────────
  - kind: ethereum
    name: V4PoolManager
    network: arc-testnet
    source:
      address: "0x016E91490d58dbea85ff91f4b941A9f39057bebb"
      abi: PoolManager
      startBlock: 27739061
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
        - Swap
        - Bundle
        - TokenHourData
        - TokenDayData
        - PoolHourData
        - PoolDayData
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)
          handler: handleV4Initialize
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleV4Swap
      file: ./src/mappings/v4-pool-manager.ts

  # ── RWA oracle (from achswap-contracts/Rwa+ADPOTOR) ────────────────────────
  - kind: ethereum
    name: RWAOracle
    network: arc-testnet
    source:
      address: "0x76398cfa526D4a76EaEC0c4709d6B7C966E5ABdB"
      abi: RWAOracle
      startBlock: 34910906
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RwaPair
        - RwaPricePoint
        - RwaPairHourData
        - RwaPairDayData
        - Token
        - TokenHourData
        - TokenDayData
      abis:
        - name: RWAOracle
          file: ./abis/RWAOracle.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: PairCreated(indexed uint256,string,string,indexed uint8,address,uint256,uint256,uint256)
          handler: handleRwaPairCreated
        - event: PriceSubmitted(indexed uint256,string,uint256,uint256,int256,indexed address,uint256)
          handler: handlePriceSubmitted
        - event: PairActiveSet(indexed uint256,bool,uint256)
          handler: handlePairActiveSet
        - event: PairFrozenSet(indexed uint256,bool,uint256)
          handler: handlePairFrozenSet
      file: ./src/mappings/rwa-oracle.ts

templates:
  - kind: ethereum
    name: PairV2
    network: arc-testnet
    source:
      abi: PairV2
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
        - Swap
        - TokenHourData
        - TokenDayData
        - PoolHourData
        - PoolDayData
      abis:
        - name: PairV2
          file: ./abis/PairV2.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Sync(uint112,uint112)
          handler: handleSync
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwapV2
      file: ./src/mappings/pair-v2.ts

  - kind: ethereum
    name: PoolV3
    network: arc-testnet
    source:
      abi: PoolV3
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Token
        - Swap
        - TokenHourData
        - TokenDayData
        - PoolHourData
        - PoolDayData
      abis:
        - name: PoolV3
          file: ./abis/PoolV3.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwapV3
      file: ./src/mappings/pool-v3.ts
